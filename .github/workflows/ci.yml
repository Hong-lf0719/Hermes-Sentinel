# CI：pytest 回归（打分引擎 40 例 + RAG 双后端 + 历史 regression）。
# pgvector 用例在本机连不上 WSL Postgres 时自动 skip，CI 无需起数据库服务。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest 不在 requirements.txt（运行时依赖不含测试），显式安装；
          # 锁 <9：pytest 9 起「test 函数 return 非None」由警告升级为失败
          pip install "pytest>=8,<9"

      - name: Syntax gate (server.py + modules)
        run: |
          python -m compileall -q server.py hermes_common.py hermes_search.py hermes_intel.py hermes_match.py

      - name: Run tests
        env:
          # 不注入任何真实密钥：外部调用路径在 CI 里走降级分支，只验证代码逻辑
          DEEPSEEK_API_KEY: ""
          TAVILY_API_KEY: ""
        run: |
          python -m pytest tests/ test_*.py -q --tb=short > /tmp/pytest.log 2>&1; rc=$?
          echo "pytest exit=$rc"
          # 失败行转成 ::error:: 注解——注解走公开 API 匿名可读（job 日志下载需管理员权限）
          grep -E "^(FAILED|ERROR) " /tmp/pytest.log | while IFS= read -r line; do echo "::error::$line"; done
          tail -5 /tmp/pytest.log | while IFS= read -r line; do echo "::error::$line"; done
          exit $rc
