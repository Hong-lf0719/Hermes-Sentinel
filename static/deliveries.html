<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投递进度 · Hermes Sentinel</title>
  <link rel="stylesheet" href="/static/common.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--txt);
           font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; }
    header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 17px; }
    .sub { color: var(--sub); font-size: 12px; margin-top: 2px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px; align-items: center;
           border-bottom: 1px solid var(--line); }
    .bar input, .bar select { padding: 7px 9px; background: var(--card); color: var(--txt);
                              border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
    .bar input[type=text] { flex: 1 1 180px; }
    button { cursor: pointer; border: none; border-radius: 8px; padding: 8px 12px;
             font-size: 13px; font-weight: 600; }
    .btn-refresh { background: var(--card2); color: var(--txt); border: 1px solid var(--line); }
    .sec-title { padding: 10px 16px 0; font-size: 12px; color: var(--sub); }
    #funnel { padding: 4px 16px 8px; }
    .sum { padding: 6px 16px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    .chip { display: flex; flex-direction: column; align-items: center; min-width: 62px; padding: 8px 10px;
            border-radius: 12px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
    .chip .n { font-size: 20px; font-weight: 800; line-height: 1; }
    .chip .t { font-size: 11px; color: var(--sub); margin-top: 3px; }
    .chip.ongoing { border-color: var(--acc); background: #0c2c3e; }
    .chip.ongoing .n { color: var(--acc); }
    .chip.active { border-color: var(--acc); background: #0c2c3e; }
    .chip.active .n { color: var(--acc); }
    .list { padding: 12px 16px; display: grid; gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; position: relative; }
    .card.dead { border-color: var(--bad); }
    .ctop { display: flex; align-items: flex-start; gap: 10px; }
    .score { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 10px; background: var(--card2);
             display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: var(--acc); }
    .cmain { flex: 1; min-width: 0; }
    .company { font-weight: 700; font-size: 15px; }
    .title { color: var(--sub); font-size: 13px; margin-top: 1px; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; color: var(--sub); font-size: 12px; }
    .meta span { background: var(--card2); padding: 3px 8px; border-radius: 6px; }
    .dl-urgent { color: var(--warn); }
    .dl-dead { color: var(--bad); }
    /* 逐卡漏斗 */
    .pipe { display: flex; align-items: center; gap: 0; margin-top: 12px; flex-wrap: wrap; }
    .stage { display: flex; align-items: center; gap: 6px; }
    .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--card2); border: 2px solid var(--line); }
    .stage.done .dot { background: var(--good); border-color: var(--good); }
    .stage.cur .dot { background: var(--acc); border-color: var(--acc); box-shadow: 0 0 0 3px rgba(56,189,248,.25); }
    .stage.rej .dot { background: var(--bad); border-color: var(--bad); }
    .slabel { font-size: 12px; color: var(--sub); }
    .stage.cur .slabel { color: var(--acc); font-weight: 700; }
    .stage.done .slabel { color: var(--txt); }
    .arrow { color: var(--line); margin: 0 4px; font-size: 12px; }
    .stage.rej { margin-left: auto; }
    /* 操作行 */
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .sg { display: flex; gap: 4px; flex-wrap: wrap; }
    .sg button { padding: 5px 10px; font-size: 12px; font-weight: 600; background: var(--card2);
                 color: var(--sub); border: 1px solid var(--line); }
    .sg button.on { color: #04293a; border-color: transparent; }
    .sg button[data-st="已投"].on { background: var(--f-已投); }
    .sg button[data-st="笔试"].on { background: var(--f-笔试); color: #1a1030; }
    .sg button[data-st="面试"].on { background: var(--f-面试); color: #2a1c00; }
    .sg button[data-st="OC"].on { background: var(--f-OC); color: #04220f; }
    .sg button[data-st="挂"].on { background: var(--f-挂); }
    .apply { margin-left: auto; padding: 6px 12px; border-radius: 8px; background: var(--acc);
             color: #04293a; font-weight: 700; font-size: 12px; text-decoration: none; }
    .apply.nolink { background: var(--card2); color: var(--sub); }
    .empty { padding: 40px 16px; text-align: center; color: var(--sub); }
  </style>
</head>
<body>
  <header>
    <h1>📮 投递进度</h1>
    <div class="sub">所有真实投递（已投→笔试→面试→OC），永不因匹配分被隐藏 · 点状态即时更新</div>
  </header>
  <div class="bar">
    <button class="btn-refresh" onclick="load()">↻ 刷新</button>
    <input type="text" id="kw" placeholder="🔍 搜公司 / 职位名…" oninput="applyFilter()" />
    <select id="fStatus" onchange="applyFilter()">
      <option value="">全部状态</option>
      <option value="已投">已投</option>
      <option value="笔试">笔试</option>
      <option value="面试">面试</option>
      <option value="OC">OC</option>
      <option value="挂">挂</option>
    </select>
    <select id="fSort" onchange="applyFilter()">
      <option value="time">按投递时间</option>
      <option value="score">按匹配分</option>
      <option value="company">按公司名</option>
    </select>
    <a class="btn-refresh" href="/jobs">← 岗位看板</a>
  </div>
  <div class="sec-title">聚合漏斗</div>
  <div id="funnel"></div>
  <div class="sum" id="sum"></div>
  <div class="list" id="list"></div>

<script src="/static/common.js"></script>
<script>
const { esc, toast, api, renderNav, funnelChart } = HermesUI;
const STAGES = ["已投", "笔试", "面试", "OC"];   // 正向漏斗
const RANK = { "已投": 1, "笔试": 2, "面试": 3, "OC": 4 };
let AUTH_TOKEN = "__WEB_TOKEN__";
let DATA = { jobs: [], counts: {}, ongoing: 0 };

renderNav("deliveries");

function fmtDate(s) { return s ? s.slice(0, 10) : ""; }

/* 筛选 + 排序（纯前端，数据已在手） */
function applyFilter() {
  const kw = document.getElementById("kw").value.trim().toLowerCase();
  const st = document.getElementById("fStatus").value;
  const sort = document.getElementById("fSort").value;
  let jobs = DATA.jobs.slice();
  if (st) jobs = jobs.filter(j => j.status === st);
  if (kw) jobs = jobs.filter(j =>
    (j.company || "").toLowerCase().includes(kw) || (j.title || "").toLowerCase().includes(kw));
  if (sort === "score") jobs.sort((a, b) => (b.match_score || 0) - (a.match_score || 0));
  else if (sort === "company") jobs.sort((a, b) => (a.company || "").localeCompare(b.company || "", "zh"));
  else jobs.sort((a, b) => (b.first_seen || "").localeCompare(a.first_seen || ""));

  renderSum(DATA);
  renderFunnel(DATA);
  const list = document.getElementById("list");
  if (!jobs.length) {
    list.innerHTML = '<div class="empty">' + (DATA.jobs.length
      ? '没有符合筛选条件的投递记录。'
      : '还没有任何投递记录。<br>在岗位看板点「已投」标记，或用浏览器扩展「记录本次投递」即可出现在这里。') + '</div>';
    return;
  }
  list.innerHTML = jobs.map(cardHTML).join("");
}

function renderFunnel(d) {
  const c = d.counts || {};
  funnelChart(document.getElementById("funnel"),
    [{ label: "已投", value: c["已投"] || 0 },
     { label: "笔试", value: c["笔试"] || 0 },
     { label: "面试", value: c["面试"] || 0 },
     { label: "OC", value: c["OC"] || 0 }]);
}

function renderSum(d) {
  const c = d.counts || {};
  const chips = [
    { t: "已投", n: c["已投"] || 0, cls: "" },
    { t: "笔试", n: c["笔试"] || 0, cls: "" },
    { t: "面试", n: c["面试"] || 0, cls: "" },
    { t: "OC", n: c["OC"] || 0, cls: "" },
    { t: "挂", n: c["挂"] || 0, cls: "" },
    { t: "进行中", n: d.ongoing || 0, cls: "ongoing" },
  ];
  document.getElementById("sum").innerHTML = chips.map(x =>
    `<div class="chip ${x.cls}" onclick="filterChip('${x.t}')"><div class="n">${x.n}</div><div class="t">${esc(x.t)}</div></div>`).join("");
}

function filterChip(t) {
  const sel = document.getElementById("fStatus");
  if (t === "进行中") { sel.value = ""; toast("进行中 = 已投/笔试/面试 全部在途记录"); applyFilter(); return; }
  sel.value = (sel.value === t) ? "" : t;
  applyFilter();
}

function pipeHTML(j) {
  const cur = RANK[j.status] || 0;
  let html = '<div class="pipe">';
  STAGES.forEach((st, i) => {
    const r = RANK[st];
    let cls = "";
    if (r < cur) cls = "done"; else if (r === cur) cls = "cur";
    html += `<div class="stage ${cls}"><span class="dot"></span><span class="slabel">${st}</span></div>`;
    if (i < STAGES.length - 1) html += '<span class="arrow">→</span>';
  });
  if (j.status === "挂") {
    html += '<div class="stage rej"><span class="dot"></span><span class="slabel">挂</span></div>';
  }
  html += "</div>";
  return html;
}

function cardHTML(j) {
  const reason = j.match_reason || "";
  const dlCls = reason.indexOf("已过期") >= 0 ? "dl-dead" : (reason.indexOf("⚠") >= 0 ? "dl-urgent" : "");
  const meta = [
    j.city && `📍 ${esc(j.city)}`,
    j.education && `🎓 ${esc(j.education)}`,
    j.deadline && `<span class="${dlCls}">⏰ ${esc(j.deadline)}</span>`,
    j.salary && `💰 ${esc(j.salary)}`,
    j.source && `📡 ${esc(j.source)}`,
    j.first_seen && `🗓 投递 ${fmtDate(j.first_seen)}`,
  ].filter(Boolean).map(x => x.indexOf("<span") === 0 ? x : `<span>${x}</span>`).join("");
  const sg = ["已投", "笔试", "面试", "OC", "挂"].map(st =>
    `<button data-st="${st}" class="${st === j.status ? 'on' : ''}" onclick="setStatus('${j.raw_hash}','${st}',this)">${st}</button>`).join("");
  const link = j.url
    ? `<a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">去投递页 ↗</a>`
    : '<span class="apply nolink">无链接</span>';
  return `<div class="card ${j.status === '挂' ? 'dead' : ''}" data-hash="${esc(j.raw_hash)}">
    <div class="ctop">
      <div class="score">${j.match_score || 0}</div>
      <div class="cmain">
        <div class="company">${esc(j.company)}</div>
        <div class="title">${esc(j.title)}</div>
      </div>
    </div>
    <div class="meta">${meta}</div>
    ${pipeHTML(j)}
    <div class="actions">
      <div class="sg">${sg}</div>
      ${link}
    </div>
  </div>`;
}

async function load() {
  try {
    DATA = await api("/api/deliveries");
    applyFilter();
  } catch (e) {
    document.getElementById("list").innerHTML =
      '<div class="empty">加载失败，确认 Hermes 服务在运行。(' + esc(e.message) + ')</div>';
  }
}

async function setStatus(hash, status, btn) {
  await api("/api/jobs/" + hash + "/status", {
    method: "POST",
    body: JSON.stringify({ status })
  });
  const grp = btn.parentElement;
  grp.querySelectorAll("button").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  toast("标记为：" + status);
  load();  // 重算汇总 + 漏斗
}

load();
</script>
</body>
</html>
