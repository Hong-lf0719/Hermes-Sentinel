<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Dashboard</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --primary: #0f3460;
    --accent: #e94560;
    --text: #eaeaea;
    --text-muted: #888;
    --border: #2a2a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .topbar h1 span { color: var(--accent); }
  .btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; text-align: center;
  }
  .stat .num { font-size: 30px; font-weight: 700; color: var(--accent); }
  .stat .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; color: var(--text); }
  .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--text-muted); }
  .kv .v { color: var(--text); font-family: 'SF Mono', monospace; }
  .tool-item { padding: 9px 0; border-bottom: 1px solid var(--border); }
  .tool-item:last-child { border-bottom: none; }
  .tool-name { color: #4a8fe7; font-weight: 600; font-size: 14px; font-family: 'SF Mono', monospace; }
  .tool-desc { color: var(--text-muted); font-size: 12px; margin-top: 2px; line-height: 1.4; }
  .usage-bar { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .usage-bar .name { width: 160px; color: #4a8fe7; font-family: 'SF Mono', monospace; font-size: 12px; }
  .usage-bar .track { flex: 1; background: var(--bg); border-radius: 6px; height: 8px; overflow: hidden; }
  .usage-bar .fill { height: 100%; background: var(--accent); border-radius: 6px; }
  .usage-bar .cnt { width: 32px; text-align: right; color: var(--text-muted); }
  .msg { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .msg:last-child { border-bottom: none; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; margin-right: 6px; }
  .badge.user { background: var(--primary); color: #4a8fe7; }
  .badge.assistant { background: rgba(233,69,96,0.2); color: var(--accent); }
  .badge.tool { background: rgba(136,136,136,0.2); color: var(--text-muted); }
  .msg .meta { color: var(--text-muted); font-size: 11px; }
  .msg .body { margin-top: 3px; color: var(--text); word-break: break-word; line-height: 1.5; }
  .report-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .report-item:last-child { border-bottom: none; }
  .report-item .info { font-size: 13px; }
  .report-item .type { color: var(--accent); font-weight: 600; }
  .report-item .time { color: var(--text-muted); font-size: 11px; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; text-align: center; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; }
  .modal.open { display: block; }
  .modal iframe { width: 100%; height: 100%; border: none; background: #fff; }
  .modal .close { position: absolute; top: 14px; right: 18px; color: #fff; font-size: 26px; cursor: pointer; z-index: 101; }
  .loading { text-align: center; color: var(--text-muted); padding: 30px; }
</style>
</head>
<body>

<div class="topbar">
  <h1><span>📊</span> Hermes Dashboard</h1>
  <div style="display:flex;gap:8px;">
    <a class="btn" href="/">← 返回聊天</a>
    <button class="btn btn-primary" onclick="load()">↻ 刷新</button>
  </div>
</div>

<div id="content">
  <div class="loading">加载中…</div>
</div>

<div class="modal" id="reportModal" onclick="if(event.target===this)closeModal()">
  <span class="close" onclick="closeModal()">×</span>
  <iframe id="reportFrame" src=""></iframe>
</div>

<script>
const REP_TYPE_LABEL = { daily: "AI 日报", job: "求职报告" };

async function load() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const r = await fetch('/api/dashboard');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    el.innerHTML = render(d);
    bindReportButtons();
  } catch (e) {
    el.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
  }
}

function render(d) {
  const conv = d.conversations || { messages: 0, sessions: 0 };
  const kb = d.knowledge_base || {};
  const tools = d.tools || [];
  const usage = d.tool_usage || [];
  const recent = d.recent || [];
  const reports = d.reports || [];

  const stats = [
    { num: conv.messages, label: "对话消息" },
    { num: conv.sessions, label: "会话数" },
    { num: kb.docs ?? "—", label: "知识库文档" },
    { num: kb.chunks ?? "—", label: "知识库片段" },
    { num: tools.length, label: "可用工具" },
    { num: reports.length, label: "日报存档" },
  ];

  let html = '<div class="grid">';
  for (const s of stats) {
    html += `<div class="stat"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`;
  }
  html += '</div>';

  // 知识库
  html += '<div class="card"><h2><span class="dot"></span>长期知识库（RAG）</h2>';
  if (kb.error) {
    html += `<div class="empty">读取失败：${kb.error}</div>`;
  } else {
    html += kv("文档数", kb.docs);
    html += kv("片段数", kb.chunks);
    html += kv("嵌入模型", kb.embedding);
    html += kv("向量维度", kb.dim);
    html += kv("存储路径", kb.path);
  }
  html += '</div>';

  // 工具清单
  html += '<div class="card"><h2><span class="dot"></span>可用工具（' + tools.length + '）</h2>';
  for (const t of tools) {
    html += `<div class="tool-item"><div class="tool-name">${esc(t.name)}</div><div class="tool-desc">${esc(t.description)}</div></div>`;
  }
  html += '</div>';

  // 工具调用记录
  html += '<div class="card"><h2><span class="dot"></span>工具调用记录</h2>';
  if (usage.length === 0) {
    html += '<div class="empty">暂无工具调用记录（和 Hermes 对话并触发工具后即出现）</div>';
  } else {
    const max = Math.max(...usage.map(u => u.count));
    for (const u of usage) {
      const pct = max ? Math.round(u.count / max * 100) : 0;
      html += `<div class="usage-bar"><span class="name">${esc(u.tool)}</span><span class="track"><span class="fill" style="width:${pct}%"></span></span><span class="cnt">${u.count}</span></div>`;
    }
  }
  html += '</div>';

  // 日报存档
  html += '<div class="card"><h2><span class="dot"></span>日报 / 求职报告存档</h2>';
  if (reports.length === 0) {
    html += '<div class="empty">暂无存档（对 Hermes 喊「发日报」后自动归档）</div>';
  } else {
    for (const rp of reports) {
      const label = REP_TYPE_LABEL[rp.type] || rp.type;
      html += `<div class="report-item"><div class="info"><span class="type">${label}</span> <span class="time">${rp.created_at}</span></div><button class="btn" data-report="${rp.id}">查看</button></div>`;
    }
  }
  html += '</div>';

  // 最近对话
  html += '<div class="card"><h2><span class="dot"></span>最近对话</h2>';
  if (recent.length === 0) {
    html += '<div class="empty">暂无对话记录</div>';
  } else {
    for (const m of recent) {
      const label = m.role === 'user' ? '你' : (m.role === 'assistant' ? 'Hermes' : '工具');
      html += `<div class="msg"><span class="badge ${m.role}">${label}</span><span class="meta">${m.created_at}</span><div class="body">${esc(m.content)}</div></div>`;
    }
  }
  html += '</div>';

  return html;
}

function kv(k, v) {
  return `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(String(v))}</span></div>`;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function bindReportButtons() {
  document.querySelectorAll('[data-report]').forEach(b => {
    b.onclick = () => openReport(b.getAttribute('data-report'));
  });
}

function openReport(id) {
  document.getElementById('reportFrame').src = '/api/dashboard/report/' + id;
  document.getElementById('reportModal').classList.add('open');
}
function closeModal() {
  document.getElementById('reportModal').classList.remove('open');
  document.getElementById('reportFrame').src = '';
}

load();
</script>
</body>
</html>
